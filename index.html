function mkFr(a,b){const f=document.createElement('span');f.className='fr';[a,b].forEach(t=>{const sp=document.createElement('span');sp.append(ZW);fill(sp,t);f.append(sp)});return f}
function fill(el,str){let i=0;const blk=k=>{let d=1,a=k;while(d&&k<str.length){if(str[k]=='{')d++;if(str[k]=='}')d--;k++}return[str.slice(a,k-1),k]};
while(i<str.length){const j=str.indexOf('\\frac{',i);if(j<0){el.append(str.slice(i));break}el.append(str.slice(i,j));const[n,k]=blk(j+6),[d,e]=blk(k+1);el.append(mkFr(n,d));i=e;el.append(ZW)}}
function setCaret(n,o){const r=document.createRange();r.setStart(n,o);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function place(){const s=getSelection();if(!s.rangeCount||!q.contains(s.anchorNode)){q.focus();const r=document.createRange();r.selectNodeContents(q);r.collapse(false);s.removeAllRanges();s.addRange(r)}return s.getRangeAt(0)}
function run(){clearInk();try{const{S,ans}=solve(ser(q));$('out').innerHTML=tr(S.map((x,j)=>`<div class="card"><div class="st">${j+1}. ${x[0]}</div>${x[1]}</div>`).join('')+`<div class="card ans"><div class="st">Jawapan</div><div class="eq">${ans}</div></div>`)}
catch(e){$('out').innerHTML=`<div class="card err">${tr(e.message)}</div>`}}
function insT(t,o){const r=place();r.deleteContents();const n=document.createTextNode(t);r.insertNode(n);setCaret(n,o)}
function insF(){const r=place();r.deleteContents();const f=mkFr('',''),af=document.createTextNode(ZW);r.insertNode(af);r.insertNode(f);setCaret(f.children[0].firstChild,1)}
$('bf').onclick=insF;
document.querySelectorAll('button').forEach(b=>b.onmousedown=e=>e.preventDefault());
$('go').onclick=run;
q.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();run()}
if(e.key=='Tab'){const a=getSelection().anchorNode,sp=a&&(a.nodeType==3?a.parentNode:a).closest('.fr>span');if(sp){e.preventDefault();const f=sp.parentNode;if(sp==f.children[0])setCaret(f.children[1].firstChild,1);else{let nx=f.nextSibling;if(!nx||nx.nodeType!=3){nx=document.createTextNode(ZW);f.after(nx)}setCaret(nx,Math.min(1,nx.length))}}}};
q.onpaste=e=>{e.preventDefault();const t=e.clipboardData.getData('text/plain').replace(/\s+/g,' '),r=place();r.deleteContents();const fg=document.createDocumentFragment();fill(fg,t);const last=fg.lastChild;r.insertNode(fg);if(last){const rr=document.createRange();rr.setStartAfter(last);rr.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(rr)}};
let LG='ms';
const TR=[['Soalan','Question'],[/Hapuskan pecahan: darab kedua-dua belah dengan (\d+) \(GSTK bagi penyebut\)/g,'Eliminate fractions: multiply both sides by $1 (LCM of denominators)'],['Kembangkan kurungan','Expand brackets'],['Kumpulkan sebutan serupa','Collect like terms'],['Pindahkan sebutan x ke kanan dan nombor ke kiri (tukar tanda)','Move x terms to the right and numbers to the left (change sign)'],['Pindahkan sebutan x ke kiri dan nombor ke kanan (tukar tanda)','Move x terms to the left and numbers to the right (change sign)'],['Ringkaskan','Simplify'],['Bahagi kedua-dua belah dengan','Divide both sides by'],['Semakan','Check'],['Gantikan','Substitute'],['kiri =','left ='],['kanan =','right ='],['Jawapan','Answer'],['Benar untuk semua nilai ','True for all values of '],['(identiti)','(identity)'],['Tiada penyelesaian','No solution'],['Nombor tidak sah','Invalid number'],['Kurungan tidak lengkap','Unclosed bracket'],['Persamaan tidak lengkap atau simbol tidak dikenali','Incomplete equation or unknown symbol'],['Simbol tidak dijangka','Unexpected symbol'],['Hanya persamaan linear satu pemboleh ubah disokong','Only linear equations in one variable are supported'],['Penyebut mesti nombor (tiada pemboleh ubah)','Denominator must be a number (no variable)'],['Penyebut sifar','Denominator is zero'],['Penyebut mesti nombor bulat','Denominator must be a whole number'],['Masukkan satu persamaan dengan satu tanda =','Enter one equation with one = sign'],['Gunakan satu pemboleh ubah sahaja (cth. x)','Use only one variable (e.g. x)'],['Pecahan tidak dapat dihapuskan','Fractions cannot be eliminated'],['Pecahan terlalu kompleks untuk dihapuskan','Fractions are too complex to eliminate'],[/Ini bukan persamaan linear \(ada kuasa (\S+)\)/g,'This is not a linear equation (it contains $1)']];
const tr=s=>LG=='ms'?s:TR.reduce((a,[m,e])=>typeof m=='string'?a.split(m).join(e):a.replace(m,e),s);
const UI={ms:{ti:'Persamaan Linear',bf:'Pecahan',go:'Selesaikan',t0:'Taip Soalan',t1:'Soalan Rawak',lt:'Pilih tahap:',lv:['Mudah','Sederhana','Sukar'],pn:'Conteng',er:'Padam',un:'Undo',cl:'Kosongkan',hb:'Sembunyi',sb:'Conteng'},en:{ti:'Linear Equations',bf:'Fraction',go:'Solve',t0:'Type a Question',t1:'Random Question',lt:'Choose level:',lv:['Easy','Medium','Hard'],pn:'Draw',er:'Erase',un:'Undo',cl:'Clear',hb:'Hide',sb:'Draw'}};
function ui(){const u=UI[LG],d=document.documentElement;$('ti').textContent=u.ti;document.title=u.ti;$('bf').textContent=u.bf;$('go').textContent=u.go;document.querySelectorAll('#seglang button').forEach(b=>b.classList.toggle('on',b.dataset.v==LG));$('t0').textContent=u.t0;$('t1').textContent=u.t1;$('lt').textContent=u.lt;document.querySelectorAll('.lb').forEach((b,i)=>b.textContent=u.lv[i]);['pn','er','un','cl','hb','sb'].forEach(k=>$(k).textContent=u[k]);d.lang=LG}
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[ri(0,a.length-1)],nz=(a,b)=>{let v=0;while(!v)v=ri(a,b);return v};
const sg=b=>b>0?'+'+b:''+b,cx=a=>a==1?'x':a==-1?'-x':a+'x',lin=(a,b)=>cx(a)+(b?sg(b):''),fc=(n,d)=>`\\frac{${n}}{${d}}`;
const GEN=[[
()=>{const x=nz(-9,12),b=ri(1,12);return pk([`x+${b}=${x+b}`,`x-${b}=${x-b}`])},
()=>{const a=ri(2,9),x=nz(-9,9);return `${a}x=${a*x}`},
()=>{const a=ri(2,9),b=nz(-12,12),x=nz(-9,9);return `${lin(a,b)}=${a*x+b}`}],[
()=>{const a=ri(2,6),b=nz(-9,9),x=ri(-8,10);return `${a}(x${sg(b)})=${a*(x+b)}`},
()=>{const a=ri(2,9),c=ri(1,a-1),b=nz(-9,9),x=nz(-8,10);return `${lin(a,b)}=${lin(c,a*x+b-c*x)}`},
()=>{const a=ri(2,6),b=nz(-8,8),x=nz(-8,9);let c=ri(1,8);if(c==a)c++;return `${a}(x${sg(b)})=${lin(c,a*(x+b)-c*x)}`},
()=>{const n=ri(2,6),k=nz(-6,8),b=nz(-9,9);return `${fc('x',n)}${sg(b)}=${k+b}`},
()=>{const n=ri(2,6),b=nz(-9,9),c=nz(-6,8);return `${fc('x'+sg(b),n)}=${c}`}],[
()=>{const a=ri(2,5),b=ri(1,9),p=ri(1,9),q=ri(2,6);return `${a}(${b}-x)=${fc(p,q)}x`},
()=>{const a=ri(2,5),b=nz(-9,9),n=ri(2,6),c=nz(-6,9);return `${fc(lin(a,b),n)}=${c}`},
()=>{const m=ri(2,5),n=ri(m+1,7),a=nz(-6,6),b=nz(-6,6),c=nz(-4,4);return `${fc('x'+sg(a),m)}=${fc('x'+sg(b),n)}${sg(c)}`},
()=>{const a=ri(2,6),c=ri(2,6),b=nz(-8,8),d=nz(-8,8);return `${a}(x${sg(b)})=${a==c?c+1:c}(x${sg(d)})`},
()=>{const a=ri(2,5),n=ri(2,5),b=nz(-6,6),c=nz(-9,9);return `${a}(${fc('x',n)}${sg(b)})=${c}`}]];
function rnd(){const g=GEN[LV];let s0;for(let i=0;i<40;i++){s0=pk(g)();try{const a=solve(s0).ans.replace(/<span class="st">.*<\/span>/,'');if(!/^(Benar|Tiada)/.test(a)&&(a.match(/\d+/g)||[]).every(n=>n.length<4))break}catch(e){}}
clearInk();q.innerHTML='';fill(q,s0);$('out').innerHTML=''}
let LV=0;
function mode(m){$('t0').classList.toggle('on',m==0);$('t1').classList.toggle('on',m==1);$('p0').classList.toggle('hd',m==1);$('p1').classList.toggle('hd',m==0);q.contentEditable=m==0?'true':'false';clearInk();q.innerHTML='';$('out').innerHTML='';if(m)rnd()}
$('t0').onclick=()=>mode(0);$('t1').onclick=()=>mode(1);
document.querySelectorAll('.lb').forEach((b,i)=>b.onclick=()=>{LV=i;document.querySelectorAll('.lb').forEach((x,j)=>x.classList.toggle('on',j==i));rnd()});
let ZM=parseInt(ld('zm'))||100;
function zoom(v){ZM=Math.max(100,Math.min(200,v));document.querySelector('main').style.zoom=ZM/100;$('zv').textContent=ZM+'%';$('zo').disabled=ZM<=100;$('zi').disabled=ZM>=200;sv('zm',ZM)}

zoom(ZM);
let INK=[],MODE=null,COL='#e53935',cur=null;
const ink=$('ink'),NS='http://www.w3.org/2000/svg',mainEl=document.querySelector('main');
function ipt(e){const r=mainEl.getBoundingClientRect(),k=ZM/100;return[(e.clientX-r.left)/k,(e.clientY-r.top)/k]}
function upd(s){let d='M'+s.p.map(a=>a[0].toFixed(1)+' '+a[1].toFixed(1)).join('L');if(s.p.length==1)d+='l0.1 0';s.el.setAttribute('d',d)}
function erase(p){INK=INK.filter(s=>{const h=s.p.some(a=>Math.hypot(a[0]-p[0],a[1]-p[1])<12);if(h)s.el.remove();return!h})}
function clearInk(){INK.forEach(s=>s.el.remove());INK=[]}
function setMode(m){MODE=MODE==m?null:m;ink.classList.toggle('on',!!MODE);$('pn').classList.toggle('on',MODE=='pn');$('er').classList.toggle('on',MODE=='er')}
let pid=null,penDown=false;
ink.onpointerdown=e=>{if(!MODE||e.pointerType=='touch'||pid!==null)return;e.preventDefault();pid=e.pointerId;penDown=true;ink.setPointerCapture(e.pointerId);const p=ipt(e);
if(MODE=='er'){cur='er';erase(p);return}
const el=document.createElementNS(NS,'path');el.setAttribute('stroke',COL);el.setAttribute('stroke-width',3);ink.append(el);
cur={p:[p],el};upd(cur);INK.push(cur)};
ink.onpointermove=e=>{if(!cur||e.pointerId!==pid)return;const p=ipt(e);if(cur=='er')erase(p);else{cur.p.push(p);upd(cur)}};

const isPen=t=>t.touchType=='stylus';
ink.addEventListener('touchstart',e=>{if(!MODE)return;if(penDown||[...e.changedTouches].some(isPen))e.preventDefault()},{passive:false});
